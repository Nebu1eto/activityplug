name: activityplug-fediverse-e2e

networks:
  fediverse:
    driver: bridge

volumes:
  mastodon-postgres:
  mastodon-redis:
  mastodon-elasticsearch:
  misskey-postgres:
  misskey-redis:
  misskey-meilisearch:
  pleroma-postgres:
  hollo-postgres:
  hollo-storage:
  hackerspub-postgres:
  hackerspub-redis:

x-postgres-healthcheck: &postgres-healthcheck
  interval: 5s
  retries: 30
  timeout: 5s

x-redis-healthcheck: &redis-healthcheck
  interval: 5s
  retries: 30
  timeout: 5s

services:
  mastodon-db:
    image: postgres:15-alpine
    profiles: ["mastodon", "fediverse"]
    environment:
      POSTGRES_DB: mastodon
      POSTGRES_USER: mastodon
      POSTGRES_PASSWORD: mastodon
    volumes:
      - mastodon-postgres:/var/lib/postgresql/data
    networks: [fediverse]
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD", "pg_isready", "-U", "mastodon"]

  mastodon-redis:
    image: redis:7-alpine
    profiles: ["mastodon", "fediverse"]
    volumes:
      - mastodon-redis:/data
    networks: [fediverse]
    healthcheck:
      <<: *redis-healthcheck
      test: ["CMD", "redis-cli", "ping"]

  mastodon-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.25
    profiles: ["mastodon", "fediverse"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - mastodon-elasticsearch:/usr/share/elasticsearch/data
    networks: [fediverse]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      retries: 30

  mastodon-web-backend:
    image: ghcr.io/mastodon/mastodon:v4.3.9
    profiles: ["mastodon", "fediverse"]
    command:
      ["bash", "-c", "bundle exec rails db:prepare && bundle exec rails s -p 3000 -b 0.0.0.0"]
    env_file: mastodon/mastodon.env
    networks: [fediverse]
    depends_on:
      mastodon-db: { condition: service_healthy }
      mastodon-redis: { condition: service_healthy }
      mastodon-elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health | grep -q OK"]
      interval: 10s
      retries: 30

  mastodon-caddy:
    image: caddy:2-alpine
    profiles: ["mastodon", "fediverse"]
    volumes:
      - ./mastodon/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      fediverse:
        aliases: ["mastodon.127.0.0.1.nip.io"]
    ports:
      - "127.0.0.1:41080:443"
    depends_on:
      mastodon-web-backend: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -qO- https://mastodon.127.0.0.1.nip.io/health | grep -q OK",
        ]
      interval: 10s
      retries: 30

  mastodon-sidekiq:
    image: ghcr.io/mastodon/mastodon:v4.3.9
    profiles: ["mastodon", "fediverse"]
    command: ["bash", "-c", "bundle exec sidekiq -q ingress -q default -q push"]
    env_file: mastodon/mastodon.env
    networks: [fediverse]
    depends_on:
      mastodon-web-backend: { condition: service_healthy }

  misskey-db:
    image: postgres:15-alpine
    profiles: ["misskey", "fediverse"]
    environment:
      POSTGRES_DB: misskey
      POSTGRES_USER: misskey
      POSTGRES_PASSWORD: misskey
    volumes:
      - misskey-postgres:/var/lib/postgresql/data
    networks: [fediverse]
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD", "pg_isready", "-U", "misskey"]

  misskey-redis:
    image: redis:7-alpine
    profiles: ["misskey", "fediverse"]
    volumes:
      - misskey-redis:/data
    networks: [fediverse]
    healthcheck:
      <<: *redis-healthcheck
      test: ["CMD", "redis-cli", "ping"]

  misskey-meilisearch:
    image: getmeili/meilisearch:v1.3.4
    profiles: ["misskey", "fediverse"]
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - misskey-meilisearch:/meili_data
    networks: [fediverse]

  misskey-web:
    build:
      context: ${ACTIVITYPLUG_SOFTWARE_ROOT:-../../../activityplug-docs}/misskey
    profiles: ["misskey", "fediverse"]
    command: ["pnpm", "run", "migrateandstart"]
    volumes:
      - ./misskey/default.yml:/misskey/.config/default.yml:ro
    networks:
      fediverse:
        aliases: ["misskey.127.0.0.1.nip.io"]
    ports:
      - "127.0.0.1:42080:3000"
    depends_on:
      misskey-db: { condition: service_healthy }
      misskey-redis: { condition: service_healthy }
      misskey-meilisearch: { condition: service_started }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -X POST -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:3000/api/ping || exit 1",
        ]
      interval: 10s
      retries: 30
      start_period: 300s

  pleroma-db:
    image: postgres:15-alpine
    profiles: ["pleroma", "fediverse"]
    environment:
      POSTGRES_DB: pleroma
      POSTGRES_USER: pleroma
      POSTGRES_PASSWORD: pleroma
    volumes:
      - pleroma-postgres:/var/lib/postgresql/data
    networks: [fediverse]
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD", "pg_isready", "-U", "pleroma"]

  pleroma-web:
    build:
      context: ${ACTIVITYPLUG_SOFTWARE_ROOT:-../../../activityplug-docs}/pleroma
    profiles: ["pleroma", "fediverse"]
    environment:
      DOMAIN: pleroma.127.0.0.1.nip.io:43080
      INSTANCE_NAME: ActivityPlug Pleroma E2E
      DB_HOST: pleroma-db
      DB_USER: pleroma
      DB_PASS: pleroma
      DB_NAME: pleroma
      SCHEME: http
      PORT: "43080"
    volumes:
      - ./pleroma/config.exs:/var/lib/pleroma/config.exs:ro
    networks:
      fediverse:
        aliases: ["pleroma.127.0.0.1.nip.io"]
    ports:
      - "127.0.0.1:43080:4000"
    depends_on:
      pleroma-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/.well-known/nodeinfo || exit 1"]
      interval: 10s
      retries: 30
      start_period: 120s

  hollo-db:
    image: postgres:16-alpine
    profiles: ["hollo", "fediverse"]
    environment:
      POSTGRES_DB: hollo
      POSTGRES_USER: hollo
      POSTGRES_PASSWORD: hollo
    volumes:
      - hollo-postgres:/var/lib/postgresql/data
    networks: [fediverse]
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD", "pg_isready", "-U", "hollo"]

  hollo-web:
    image: ghcr.io/fedify-dev/hollo@sha256:93247b88f3b2d7ecac78806d0938772a6b6daea78a34fdf1dbe64d72129faa46
    profiles: ["hollo", "fediverse"]
    environment:
      DATABASE_URL: postgres://hollo:hollo@hollo-db:5432/hollo
      ORIGIN: http://hollo.127.0.0.1.nip.io:44080
      BEHIND_PROXY: "true"
      DRIVE_DISK: fs
      FS_STORAGE_PATH: /var/lib/hollo
      STORAGE_URL_BASE: http://hollo.127.0.0.1.nip.io:44080/assets/
      SECRET_KEY: activityplug-hollo-e2e-local-only-secret-with-minimum-length
    volumes:
      - hollo-storage:/var/lib/hollo
    networks:
      fediverse:
        aliases: ["hollo.127.0.0.1.nip.io"]
    ports:
      - "127.0.0.1:44080:3000"
    depends_on:
      hollo-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/.well-known/nodeinfo || exit 1"]
      interval: 10s
      retries: 30
      start_period: 120s

  hackerspub-db:
    image: postgres:16-alpine
    profiles: ["hackerspub", "fediverse"]
    environment:
      POSTGRES_DB: hackerspub
      POSTGRES_USER: hackerspub
      POSTGRES_PASSWORD: hackerspub
    volumes:
      - hackerspub-postgres:/var/lib/postgresql/data
    networks: [fediverse]
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD", "pg_isready", "-U", "hackerspub"]

  hackerspub-redis:
    image: redis:7-alpine
    profiles: ["hackerspub", "fediverse"]
    volumes:
      - hackerspub-redis:/data
    networks: [fediverse]
    healthcheck:
      <<: *redis-healthcheck
      test: ["CMD", "redis-cli", "ping"]

  hackerspub-web:
    build:
      context: ${ACTIVITYPLUG_SOFTWARE_ROOT:-../../../activityplug-docs}/hackerspub
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: activityplug-e2e
    command:
      [
        "sh",
        "-c",
        'deno task migrate && export INSTANCE_ACTOR_KEY="$(deno run --allow-read --allow-env scripts/keygen.ts)" && deno task start',
      ]
    profiles: ["hackerspub", "fediverse"]
    env_file: hackerspub/hackerspub.env
    networks:
      fediverse:
        aliases: ["hackerspub.127.0.0.1.nip.io"]
    ports:
      - "127.0.0.1:45080:8000"
    depends_on:
      hackerspub-db: { condition: service_healthy }
      hackerspub-redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/.well-known/nodeinfo || exit 1"]
      interval: 10s
      retries: 30
      start_period: 120s
