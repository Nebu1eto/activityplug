services:
  postgres:
    image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: activityplug
      POSTGRES_PASSWORD: activityplug
      POSTGRES_USER: activityplug
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - activityplug-dev-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activityplug -d activityplug"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.8.0-alpine3.23@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - activityplug-dev-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  activityplug-dev-postgres:
  activityplug-dev-redis:
