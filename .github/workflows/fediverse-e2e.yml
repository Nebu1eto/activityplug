name: Fediverse E2E

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fediverse-e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "11.12.0"
  ACTIVITYPLUG_FEDIVERSE_E2E_REQUIRED: "1"
  ACTIVITYPLUG_FEDIVERSE_REQUIRED_ADAPTERS: mastodon,misskey,pleroma,hollo,hackerspub

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Reset disposable services
        run: docker compose -f test/e2e/docker-compose.yml down --volumes --remove-orphans
      - name: Run all required server and adapter targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          bash test/e2e/run-fediverse-matrix.sh \
            2> >(node .github/scripts/redact-evidence.mjs | tee artifacts/service-logs.txt >&2) \
            | node .github/scripts/redact-evidence.mjs \
              --stage-results artifacts/stage-results.jsonl
      - name: Capture service logs
        if: failure()
        run: |
          docker compose -f test/e2e/docker-compose.yml logs --no-color 2>&1 \
            | node .github/scripts/redact-evidence.mjs \
            >> artifacts/service-logs.txt || true
      - name: Validate failure evidence redaction
        if: failure()
        run: node .github/scripts/redact-evidence.mjs --check artifacts/*
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fediverse-e2e-failure-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Remove disposable services
        if: always()
        run: docker compose -f test/e2e/docker-compose.yml down --volumes --remove-orphans
