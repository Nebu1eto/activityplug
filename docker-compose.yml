name: activityplug-durable

services:
  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: examples/web-client/Dockerfile
      args:
        NODE_IMAGE: ${ACTIVITYPLUG_NODE_IMAGE:?set a digest-pinned Node image}
        CADDY_IMAGE: ${ACTIVITYPLUG_CADDY_IMAGE:?set a digest-pinned Caddy image}
        PNPM_VERSION: ${ACTIVITYPLUG_PNPM_VERSION:?set the Task 1 pnpm patch}
    environment:
      CADDY_HOST: localhost
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./examples/web-client/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - activityplug-caddy:/data
      - activityplug-caddy-config:/config
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=16m
    pids_limit: 128
    mem_limit: 256m
    cpus: "0.50"
    networks:
      product-edge:
        ipv4_address: 172.30.0.2
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --quiet --spider https://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  server:
    restart: unless-stopped
    build:
      context: .
      dockerfile: examples/web-client/server.Dockerfile
      args:
        NODE_IMAGE: ${ACTIVITYPLUG_NODE_IMAGE:?set a digest-pinned Node image}
        PNPM_VERSION: ${ACTIVITYPLUG_PNPM_VERSION:?set the Task 1 pnpm patch}
    environment:
      ACTIVITYPLUG_STORAGE: durable
      ACTIVITYPLUG_PUBLIC_ORIGIN: https://localhost:8443
      ACTIVITYPLUG_COOKIE_SIGNING_KEY: ${ACTIVITYPLUG_COOKIE_SIGNING_KEY:?set a cookie-signing key}
      ACTIVITYPLUG_ANONYMOUS_SESSION_MODE: stateless
      ACTIVITYPLUG_ALLOWED_REMOTE_ORIGINS: ${ACTIVITYPLUG_ALLOWED_REMOTE_ORIGINS:?set explicit remote origins}
      ACTIVITYPLUG_TRUSTED_PROXY_ADDRESSES: 172.30.0.2
      DATABASE_URL: postgresql://activityplug:${ACTIVITYPLUG_POSTGRES_PASSWORD:?set a URL-safe PostgreSQL password}@postgres:5432/activityplug
      REDIS_URL: redis://:${ACTIVITYPLUG_REDIS_PASSWORD:?set a URL-safe Redis password}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=16m
    pids_limit: 128
    mem_limit: 256m
    cpus: "1.00"
    networks:
      product-edge:
        ipv4_address: 172.30.0.3
      product-data: {}

  postgres:
    restart: unless-stopped
    image: ${ACTIVITYPLUG_POSTGRES_IMAGE:?set a digest-pinned PostgreSQL image}
    environment:
      POSTGRES_DB: activityplug
      POSTGRES_PASSWORD: ${ACTIVITYPLUG_POSTGRES_PASSWORD:?set a URL-safe PostgreSQL password}
      POSTGRES_USER: activityplug
    volumes:
      - activityplug-postgres:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'PGPASSWORD="$${POSTGRES_PASSWORD}" psql --username=activityplug --dbname=activityplug --no-psqlrc --tuples-only --command=''SELECT 1'' >/dev/null',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.00"
    networks:
      product-data: {}

  redis:
    restart: unless-stopped
    image: ${ACTIVITYPLUG_REDIS_IMAGE:?set a digest-pinned Redis image}
    command:
      ["/bin/sh", "-ec", 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"']
    environment:
      REDIS_PASSWORD: ${ACTIVITYPLUG_REDIS_PASSWORD:?set a URL-safe Redis password}
    volumes:
      - activityplug-redis:/data
    healthcheck:
      test:
        ["CMD-SHELL", 'redis-cli --no-auth-warning --user default --pass "$${REDIS_PASSWORD}" ping']
      interval: 5s
      timeout: 3s
      retries: 12
    pids_limit: 64
    mem_limit: 256m
    cpus: "0.50"
    networks:
      product-data: {}

volumes:
  activityplug-caddy:
  activityplug-caddy-config:
  activityplug-postgres:
  activityplug-redis:

networks:
  product-edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  product-data:
    internal: true
